services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-api:dev
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: churn-frontend:dev
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped